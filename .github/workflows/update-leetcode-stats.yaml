name: Update LeetCode Stats Image

on:
  schedule:
    - cron: "0 16 * * *" # daily at 00:00 Asia/Shanghai (UTC+8)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-leetcode-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download LeetCode stats image
        run: bash scripts/download-leetcode-stats.sh

      - name: Style heatmap (zero submissions → gray)
        run: node scripts/stylize-leetcode-heatmap.js content/assets/leetcode-stats.svg

      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- "content/assets/leetcode-stats.svg"; then
            echo "No changes."
            exit 0
          fi

          git add "content/assets/leetcode-stats.svg"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update leetcode stats image"
          git push

