name: Sync LeetCode Image

on:
  schedule:
    - cron: "0 17 * * *" # 每天北京时间 01:00 (UTC 17:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install playwright sharp
          npx playwright install chromium --with-deps

      - name: Run screenshot script
        run: node scripts/screenshot-leetcode.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/assets/leetcode-profile.png
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update leetcode profile image"
          
          # Retry logic for git push
          n=0
          until [ "$n" -ge 5 ]
          do
             git pull --rebase && git push && break
             n=$((n+1))
             echo "Push failed, retrying in 15 seconds..."
             sleep 15
          done
